name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Configure git identity for tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      - name: Unit and end-to-end tests
        run: npm test
      - name: Repository contains no secrets
        run: node bin/agent-guard.mjs scan .
      - name: Smoke test the CLI
        run: |
          node bin/agent-guard.mjs check "npm test"
          node bin/agent-guard.mjs check "rm -rf /" || test $? -eq 2
